name: creditos
description: "Aplicación offline-first para gestión de créditos y cobros."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  injectable: ^2.5.1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.39
  supabase_flutter: ^2.10.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  webview_flutter_windows: ^1.1.1
  geolocator: ^14.1.2
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0
  injectable_generator: ^2.8.1

flutter:
  uses-material-design: true
